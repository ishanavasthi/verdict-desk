name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # @prisma/client is code-generated; do it before lint/typecheck/test.
      - name: Generate Prisma client
        run: pnpm --filter @verdict/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
